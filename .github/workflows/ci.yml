name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # tests/CMakeLists.txt turns on UBSan with -fno-sanitize-recover. That is load-bearing
  # rather than hygiene (see the comment there), so a sanitizer abort is a real failure
  # and must not be retried or downgraded.
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build

      - name: Run
        run: ctest --test-dir build --output-on-failure
